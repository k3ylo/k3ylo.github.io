<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>saykiry</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/home.css">
</head>
<body>
  <div class="home">
    <header class="home-header">
      <span class="home-title">saykiry/main</span>
    </header>
    <div class="home-container">
      <main class="home-main">
        <div class="logo-container">
          <div class="video-logo">
            <video 
              class="afk-video" 
              autoplay 
              loop 
              muted 
              playsinline
            >
              <source src="assets/afk.mp4" type="video/mp4">
              Your browser does not support the video tag.
            </video>
          </div>
        </div>

        <div class="nav-buttons">
          <div class="nav-buttons">
  <button class="nav-btn" onclick="window.location.href='configs.html'">configs</button>
  <button class="nav-btn" onclick="window.location.href='social.html'">social</button>
  <button class="nav-btn" onclick="window.location.href='videos.html'">videos</button>
</div>

<!-- СТРЕЛКА ДЛЯ ПРОКРУТКИ К SETUP -->
<div class="scroll-down" id="scrollDownBtn">↓</div>
          <button class="nav-btn" onclick="window.location.href='configs.html'">
            configs
          </button>
          <button class="nav-btn" onclick="window.location.href='social.html'">
            social
          </button>
          <button class="nav-btn" onclick="window.location.href='videos.html'">
            videos
          </button>
        </div>
      </main>
    </div>
  </div>

  <!-- Блок с характеристиками ПК (будет внизу) -->
  <div id="setup-container"></div>

  <script src="./scripts/data.js"></script>
  <script src="./scripts/setup.js"></script>
  <script>
  document.getElementById('scrollDownBtn').addEventListener('click', function() {
    document.getElementById('setup-container').scrollIntoView({ behavior: 'smooth' });
  });
</script>
</body>
</html>
