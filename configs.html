<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>saykiry/configs</title>
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/configs.css">
</head>
<body>
  <div class="layout">
    <header class="header">
      <div class="header-left">
        <span class="page-title">saykiry/configs</span>
        <button class="back-btn" id="backBtn">back</button>
      </div>
    </header>
    <main class="main-content">
      <div class="configs-container" id="configsContainer">
        <div class="loading">Loading...</div>
      </div>
    </main>
  </div>
  <script src="./scripts/data.js"></script>
  <script src="./scripts/configs.js"></script>
  <script>
    document.getElementById('backBtn').addEventListener('click', function() {
      // Если есть предыдущая страница и она с этого же сайта — идём назад
      if (document.referrer && document.referrer.includes(window.location.host)) {
        window.history.back();
      } else {
        // Иначе — на главную
        window.location.href = '/';
      }
    });
  </script>
</body>
</html>
